# MkDocs configuration for the project site (docs in docs/nl and docs/en).
# Build: mkdocs build --strict (see .github/workflows/build-deploy.yml)

site_name: Leerharnas
site_url: https://piethanegraaf.github.io/
# The fallback description for pages without their own `description:` in the front matter.
site_description: >-
  Een gratis, open-source leerharnas voor Claude Code: hooks voorkomen dat de AI je
  oefencode schrijft, hulp komt in stappen en een dashboard volgt je vaardigheden.
docs_dir: docs
site_dir: site
strict: true

copyright: >-
  Code: AGPL-3.0 · Teksten, docs en data: CC BY-NC 4.0 ·
  Gemaakt met hulp van Claude (Anthropic), zie de AI-verklaring

theme:
  name: material
  # overrides/main.html: hreflang, page titles and JSON-LD. overrides/sitemap.xml: the sitemap.
  custom_dir: overrides
  language: nl
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Donker thema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Licht thema
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search
  # Social cards: a preview image per page, plus og: and twitter: tags. They need Cairo,
  # so they are only made in CI (CI=true); a local build skips them.
  - social:
      enabled: !ENV [CI, false]
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          name: Nederlands
          default: true
          build: true
          site_name: Leerharnas
        - locale: en
          name: English
          build: true
          site_name: Learning harness
          site_description: >-
            A free, open-source Claude Code setup for students learning to program. Hooks stop
            the AI from writing practice code, help comes in steps, and a dashboard tracks skill levels.
          copyright: >-
            Code: AGPL-3.0 · Texts, docs and data: CC BY-NC 4.0 ·
            Made with help from Claude (Anthropic), see the AI statement
          # Own nav: the dashboard and the cheat sheet have an English URL of their own.
          nav:
            - Home: index.md
            - Get started:
                - How it works: how-it-works.md
                - Install: install.md
                - Configuration and privacy: configuration.md
                - Updating the dashboard: progress-dashboard.md
                - Reference: reference.md
            - Tools:
                - Dashboard: /dashboard/?lang=en
                - C# OOP cheat sheet: /en/cheatsheet/
            - Research:
                - Literature review: research.md
            - Who it is for:
                - For educators: for-educators.md
                - For researchers: for-researchers.md
            - About this project:
                - AI statement: ai-statement.md

  # The date of the last change per page, from git (CI checks out the full history).
  # It has to come after i18n, which gives every page its locale.
  - git-revision-date-localized:
      type: date

# Every item sits under a heading. The research notes are not in the menu:
# they are linked from the literature review (and the notes overview).
nav:
  - Start: index.md
  - Aan de slag:
      - Hoe het werkt: how-it-works.md
      - Installeren: install.md
      - Configuratie en privacy: configuration.md
      - Dashboard bijwerken: progress-dashboard.md
      - Naslag: reference.md
  - Gebruiken:
      - Dashboard: /dashboard/
      - C# OOP-cheat sheet: /cheatsheet/
  - Onderzoek:
      - Literatuuronderzoek: research.md
  - Voor wie:
      - Voor docenten: for-educators.md
      - Voor onderzoekers: for-researchers.md
  - Over dit project:
      - AI-verklaring: ai-statement.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Mermaid is self-hosted: CI downloads a pinned, integrity-checked copy into
# site/assets/javascripts/vendor/. Because window.mermaid then exists,
# Material does not load mermaid from its CDN (unpkg).
extra_css:
  - assets/stylesheets/risk-matrix.css
  - assets/stylesheets/a11y.css

extra_javascript:
  - assets/javascripts/vendor/mermaid.min.js
  - assets/javascripts/cheatsheet-redirect.js
  - assets/javascripts/a11y.js
  # GoatCounter (visits, no cookies): the endpoint first, then count.js, self-hosted like mermaid.
  - assets/javascripts/goatcounter.js
  - path: assets/javascripts/vendor/count.js
    async: true
