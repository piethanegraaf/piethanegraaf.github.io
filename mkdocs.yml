# MkDocs configuration for the project site (docs in docs/nl and docs/en).
# Build: mkdocs build --strict (see .github/workflows/build-deploy.yml)

site_name: Leerharnas
site_url: https://piethanegraaf.github.io/
docs_dir: docs
site_dir: site
strict: true

copyright: >-
  Code: MIT · Teksten, docs en data: CC BY-NC 4.0

theme:
  name: material
  language: nl
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Donker thema
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Licht thema
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: nl
          name: Nederlands
          default: true
          build: true
          site_name: Leerharnas
        - locale: en
          name: English
          build: true
          site_name: Learning harness

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Mermaid is self-hosted: CI downloads a pinned, integrity-checked copy into
# site/assets/javascripts/vendor/. Because window.mermaid then exists,
# Material does not load mermaid from its CDN (unpkg).
extra_javascript:
  - assets/javascripts/vendor/mermaid.min.js
