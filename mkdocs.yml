# MkDocs configuration for the project site (docs in docs/en and docs/nl).
# Build: mkdocs build --strict (see .github/workflows/build-deploy.yml)
# English is the default language and lives at the root; Dutch lives under /nl/.
# The old English URLs under /en/ redirect to the root (harness/site-redirects.mjs).

site_name: Learning harness
site_url: https://piethanegraaf.github.io/
site_author: Piet Hanegraaf
# The fallback description for pages without their own `description:` in the front matter.
site_description: >-
  A free, open-source Claude Code setup for students and junior developers. Hooks stop
  the AI from writing practice code, help comes in steps, and a dashboard tracks skill levels.
docs_dir: docs
site_dir: site
strict: true

copyright: >-
  © 2026 Piet Hanegraaf · Code: AGPL-3.0 · Texts, docs and data: CC BY-NC 4.0 ·
  Made with help from Claude (Anthropic), see the AI statement

theme:
  name: material
  # overrides/main.html: hreflang, page titles and JSON-LD. overrides/sitemap.xml: the sitemap.
  custom_dir: overrides
  language: en
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Light theme
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search
  # Privacy: downloads the Google Fonts at build time and serves them from this site, so a visitor's
  # browser does not contact Google and no stylesheet from another domain blocks rendering.
  - privacy:
      # Not mermaid from unpkg: CI adds a pinned, integrity-checked copy (build-deploy.yml),
      # and overrides/main.html loads it only where a page has a diagram.
      assets_exclude:
        - unpkg.com/*
  # Social cards: a preview image per page, plus og: and twitter: tags. They need Cairo,
  # so they are only made in CI (CI=true); a local build skips them.
  - social:
      enabled: !ENV [CI, false]
  - i18n:
      docs_structure: folder
      # The fallback is needed for the shared files in docs/assets: without it the Dutch build has none.
      # It also builds a copy of each English-only research note under /nl/notes/. Those copies have the
      # English note as their canonical and stay out of the sitemap (overrides/), and the Dutch pages
      # link to the English notes.
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Learning harness
        - locale: nl
          name: Nederlands
          build: true
          site_name: Leerharnas
          site_description: >-
            Een gratis, open-source leerharnas voor Claude Code, voor studenten en junior developers: hooks
            voorkomen dat de AI je oefencode schrijft, hulp komt in stappen en een dashboard volgt je vaardigheden.
          copyright: >-
            © 2026 Piet Hanegraaf · Code: AGPL-3.0 · Teksten, docs en data: CC BY-NC 4.0 ·
            Gemaakt met hulp van Claude (Anthropic), zie de AI-verklaring
          # Own nav: the dashboard and the cheat sheet have a Dutch URL of their own.
          nav:
            - Start: index.md
            - Aan de slag:
                - Hoe het werkt: how-it-works.md
                - Installeren: install.md
                - Configuratie en privacy: configuration.md
                - Dashboard bijwerken: progress-dashboard.md
                - Naslag: reference.md
                - Voor junior developers: for-juniors.md
                - Voor docenten: for-educators.md
                - Leermodus van Claude Code vs. harnas: claude-code-learning-mode.md
            - Gebruiken:
                - Dashboard: /dashboard/?lang=nl
                - C# OOP-cheat sheet: /nl/cheatsheet/
                - Oefeningen veilig programmeren: secure-coding-exercises.md
            - Onderzoek:
                - Literatuuronderzoek: research.md
                - Voor onderzoekers: researchers.md
                - Begrippen: key-terms.md
            - Over dit project:
                - Over mij: about.md
                - AI-verklaring: ai-statement.md

  # The date of the last change per page, from git (CI checks out the full history).
  # It has to come after i18n, which gives every page its locale.
  - git-revision-date-localized:
      type: date

# Every item sits under a heading. The research notes are not in the menu:
# they are linked from the literature review (and the notes overview).
nav:
  - Home: index.md
  - Get started:
      - How it works: how-it-works.md
      - Install: install.md
      - Configuration and privacy: configuration.md
      - Updating the dashboard: progress-dashboard.md
      - Reference: reference.md
      - For junior developers: for-juniors.md
      - For educators: for-educators.md
      - Claude Code learning mode vs. harness: claude-code-learning-mode.md
  - Tools:
      - Dashboard: /dashboard/?lang=en
      - C# OOP cheat sheet: /cheatsheet/
      - Secure coding exercises: secure-coding-exercises.md
  - Research:
      - Literature review: research.md
      - For researchers: researchers.md
      - Key terms: key-terms.md
  - About this project:
      - About me: about.md
      - AI statement: ai-statement.md

# The footer icons (Material draws them as inline SVG: nothing is loaded from elsewhere).
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/piethanegraaf
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/piet-hanegraaf/
      name: LinkedIn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Mermaid is self-hosted: CI downloads a pinned, integrity-checked copy into
# site/assets/javascripts/vendor/. overrides/main.html loads it only on pages with a diagram
# (it is about 1 MB). Because window.mermaid then exists, Material does not load it from its
# CDN (unpkg).
extra_css:
  - assets/stylesheets/a11y.css

# defer: these scripts do not block rendering, and deferred scripts still run in this order, so
# goatcounter.js (the endpoint) runs before count.js.
extra_javascript:
  - path: assets/javascripts/cheatsheet-redirect.js
    defer: true
  - path: assets/javascripts/a11y.js
    defer: true
  # GoatCounter (visits, no cookies): the endpoint first, then count.js, self-hosted like mermaid.
  - path: assets/javascripts/goatcounter.js
    defer: true
  - path: assets/javascripts/vendor/count.js
    defer: true
