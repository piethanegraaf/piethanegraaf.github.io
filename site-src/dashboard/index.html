<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Leerdashboard van de leerharnas: niveaus, taken, herhalingen en reflecties per vaardigheid.">
<title>Leerdashboard</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main" id="skip">Naar de inhoud</a>
<header class="top">
  <div class="top-inner">
    <div>
      <a class="brand" href="../" id="brand">Leerharnas</a>
      <h1 id="title">Leerdashboard</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
    <div class="controls" role="group" id="controls">
      <div class="seg" role="group" id="lang-group">
        <button type="button" data-lang="nl" aria-pressed="true">NL</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="seg" role="group" id="source-group">
        <button type="button" data-source="progress" aria-pressed="true" id="src-real">Echte data</button>
        <button type="button" data-source="demo" aria-pressed="false" id="src-demo">Demo</button>
      </div>
      <button type="button" class="theme" id="theme" aria-label="Thema wisselen">◐</button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
  <p class="loading" id="status">Laden…</p>
</main>
<footer class="foot" id="footer"></footer>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
</body>
</html>
