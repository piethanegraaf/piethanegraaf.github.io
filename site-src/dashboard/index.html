<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://piethanegraaf.goatcounter.com/count; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<!-- Not in search results: a script draws the content from the data, so a crawler sees an almost empty page. -->
<meta name="robots" content="noindex, follow">
<meta name="description" content="Leerdashboard van de leerharnas: niveaus, taken, herhalingen en reflecties per vaardigheid.">
<title>Leerdashboard</title>
<link rel="icon" href="../assets/images/favicon.png">
<link rel="stylesheet" href="../assets/fonts/static.css">
<link rel="stylesheet" href="style.css">
<script src="next-step.js" defer></script>
<script src="app.js" defer></script>
<script data-goatcounter="https://piethanegraaf.goatcounter.com/count" async src="../assets/javascripts/vendor/count.js"></script>
</head>
<body>
<a class="skip" href="#main" id="skip">Naar de inhoud</a>
<header class="top">
  <div class="top-inner">
    <a class="brand" href="../" id="brand">Leerharnas</a>
    <div class="controls" role="group" id="controls">
      <div class="seg" role="group" id="lang-group" aria-label="Taal">
        <button type="button" data-lang="nl" aria-pressed="true">NL</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <div class="seg" role="group" id="source-group" aria-label="Data">
        <button type="button" data-source="progress" aria-pressed="true" id="src-real">Echte data</button>
        <button type="button" data-source="demo" aria-pressed="false" id="src-demo">Demo</button>
      </div>
      <button type="button" class="theme" id="theme" aria-label="Thema wisselen">◐</button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
  <div class="page-head">
    <h1 id="title">Leerdashboard</h1>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="content" id="content"><p class="loading" id="status">Laden…</p></div>
</main>
<footer class="foot" id="footer"></footer>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

</html>
